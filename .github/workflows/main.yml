name: Generate Podcast Feeds
on: [push]
jobs:
   build:
       runs-on: ubuntu-latest
       steps:
           - name: Checkout Repo
             uses: actions/checkout@v3
           - name: Run Feed Generator
             uses: Janhavi25verma/podcast-generator@main
             with:
                name: ${{ github.actor }}
                email: ${{ github.actor }}@users.noreply.github.com 
